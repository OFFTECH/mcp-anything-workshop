[project]
name = "mcp-anything-workshop"
version = "0.1.0"
description = "Workshop material: build a CalculiX MCP server with MCP-Anything"
requires-python = ">=3.11.4"
dependencies = []

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not solver"]
markers = ["solver: runs CalculiX and Gmsh; only inside the workshop dev container"]
